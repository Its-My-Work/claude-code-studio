<!DOCTYPE html>
<html>
<body>
  <script>
    const ws = new WebSocket('ws://localhost:3000');
    ws.onopen = () => {
      console.log('Connected');
      ws.send(JSON.stringify({
        type: 'chat',
        text: 'Hello from test',
        sessionId: null,
        tabId: 'test-tab'
      }));
    };
    ws.onmessage = (msg) => console.log('Message:', msg.data);
    ws.onerror = (err) => console.error('Error:', err);
  </script>
</body>
</html>

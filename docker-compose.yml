version: '3.8'

services:
  claude-chat:
    build:
      context: .
      args:
        BASE_IMAGE: ${MIRROR:+${MIRROR}/}node:20-bookworm
    container_name: claude-code-studio
    restart: unless-stopped
    #ports:
    #  - "${PORT:-3000}:3000"
    volumes:
      - chat-data:/app/data
      - workspace:/app/workspace
      - skills:/app/skills
      - claude-home:/home/node/.claude
      # ~/.claude.json is a SIBLING of ~/.claude/, not inside it — the volume
      # above never covered it. It's where the `claude` CLI keeps firstStartTime/
      # migration flags/onboarding state, so every redeploy reset it to a blank
      # slate and the interactive (Subscription/tmux) engine re-ran first-run
      # setup — theme picker, trust dialog — as if freshly installed, blocking
      # the chat until someone answered it in the live pane. Same class of gap
      # already fixed for cdesktop's /root/.claude equivalent.
      #
      # A named volume can't be used here: its root is always a directory, and
      # this target is a single file — Docker would silently turn ~/.claude.json
      # into a directory, which the CLI cannot read as JSON. A host bind mount
      # to an existing file doesn't have that problem, same as the hh mounts
      # below; the host file must already exist (seeded once, chowned to this
      # container's uid/gid 1000) before the first deploy that uses this line.
      - /etc/easypanel/projects/main/code/claude-json/claude.json:/home/node/.claude.json
      # The hh project used to be a git-less snapshot dropped into the workspace
      # volume (no remote, one auto-commit, silently drifting from the real
      # deploy). Bind-mount the actual git checkout Easypanel builds `hh` from
      # instead, so edits here land in the real source and a redeploy of hh
      # picks them up directly — chowned to uid/gid 1000 (this container's
      # `node` user) so it's actually writable, not just readable.
      - /etc/easypanel/projects/hh/hh/code:/app/workspace/hh
      # hh's live runtime data (hh.ru sessions/tokens, resumes, etc.) — read-only:
      # letting an unrelated container write into it risks corrupting whatever
      # hh itself is concurrently reading/writing (e.g. a sqlite file), and
      # there's no reason this side needs write access to see it.
      - /etc/easypanel/projects/hh/hh/volumes/hh-data:/app/workspace/hh-data:ro
    environment:
      - PORT=3000
      # Inside the container the app must listen on all interfaces, otherwise the
      # published port above maps to nothing. The container boundary is the wall here.
      - HOST=0.0.0.0
      - WORKDIR=/app/workspace
      # /app is an image layer — anything written there is lost when the container
      # is recreated. config.json (every MCP server, skill and terminal setting the
      # config UI writes) and .env therefore live on the data volume instead.
      - CCS_CONFIG_PATH=/app/data/config.json
      - CCS_ENV_PATH=/app/data/.env
      # opencode (externalAgents engine) defaults to $HOME/.local/share|.config|.cache
      # /.local/state — none of that is a volume, so a login there is lost on every
      # redeploy. It honours the standard XDG_* vars, so point them at the data
      # volume instead, same reasoning as CCS_CONFIG_PATH/CCS_ENV_PATH above.
      - XDG_CONFIG_HOME=/app/data/opencode/config
      - XDG_DATA_HOME=/app/data/opencode/data
      - XDG_CACHE_HOME=/app/data/opencode/cache
      - XDG_STATE_HOME=/app/data/opencode/state
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=${CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS:-}
      # Room ("comната") budget — how many bot contributions / rounds before it force-closes,
      # regardless of whether the work is actually finished. Code defaults are 10 messages /
      # 3 rounds; a tool-heavy room (research + file edits + a QA verification pass, not just
      # talk) burns through 10 fast and can hit the cap mid-fix rather than after — seen live
      # 2026-09-15, where it cut the room right after a bot flagged a security contradiction
      # and before anyone could act on the fix. Raised the message cap here; read once at
      # startup like the other run-limit vars above, so a change needs a restart.
      - ROOM_MAX_MESSAGES=${ROOM_MAX_MESSAGES:-50}
      - ROOM_MAX_ROUNDS=${ROOM_MAX_ROUNDS:-3}
      # Who sits in a conversation room: `auto` (default) = one short model call picks the bots the task
      # needs and their order; `priority` = roster order (room_priority, then alphabetical).
      - ROOM_SEATING=${ROOM_SEATING:-auto}
      # Web access for bots: a SearXNG instance (JSON format on) switches on the built-in `web` MCP
      # server (web_search + web_fetch). Empty = no such server. See docs/web-tools.md.
      - WEB_SEARCH_URL=${WEB_SEARCH_URL:-}
      # Multi-agent ("Мульти") mode: same idea as the room caps above, but for the
      # dependency-wave orchestrator (runMultiAgent/agent-dag.js). A wave is one batch of
      # agents whose deps are satisfied; MULTI_AGENT_MAX_PLAN only bounds this indirectly
      # (worst case one wave per agent if the plan chains linearly) — this is a direct
      # ceiling so a plan with unexpectedly deep chained dependencies fails fast instead of
      # running indefinitely one wave at a time.
      - MULTI_AGENT_MAX_WAVES=${MULTI_AGENT_MAX_WAVES:-5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Host is a single-core 2.9GB VPS shared with other services (n8n, vaultwarden,
    # traefik, the Easypanel panel itself). A runaway subprocess spawned through the
    # externalAgents engine (e.g. opencode) previously pegged the host hard enough
    # that only a full reboot recovered it. Capping here means the kernel OOM-kills
    # inside this container's cgroup instead of starving the whole host.
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
          pids: 1024
        reservations:
          memory: 512M
    networks:
      - easypanel

networks:
  easypanel:
    external: true

volumes:
  chat-data:
  workspace:
  skills:
  claude-home:

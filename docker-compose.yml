version: '3.8'

services:
  claude-chat:
    build:
      context: .
      args:
        BASE_IMAGE: ${MIRROR:+${MIRROR}/}node:20-bookworm
    container_name: claude-code-studio
    restart: unless-stopped
    #ports:
    #  - "${PORT:-3000}:3000"
    volumes:
      - chat-data:/app/data
      - workspace:/app/workspace
      - skills:/app/skills
      - claude-home:/home/node/.claude
    environment:
      - PORT=3000
      # Inside the container the app must listen on all interfaces, otherwise the
      # published port above maps to nothing. The container boundary is the wall here.
      - HOST=0.0.0.0
      - WORKDIR=/app/workspace
      # /app is an image layer — anything written there is lost when the container
      # is recreated. config.json (every MCP server, skill and terminal setting the
      # config UI writes) and .env therefore live on the data volume instead.
      - CCS_CONFIG_PATH=/app/data/config.json
      - CCS_ENV_PATH=/app/data/.env
      # opencode (externalAgents engine) defaults to $HOME/.local/share|.config|.cache
      # /.local/state — none of that is a volume, so a login there is lost on every
      # redeploy. It honours the standard XDG_* vars, so point them at the data
      # volume instead, same reasoning as CCS_CONFIG_PATH/CCS_ENV_PATH above.
      - XDG_CONFIG_HOME=/app/data/opencode/config
      - XDG_DATA_HOME=/app/data/opencode/data
      - XDG_CACHE_HOME=/app/data/opencode/cache
      - XDG_STATE_HOME=/app/data/opencode/state
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=${CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Host is a single-core 2.9GB VPS shared with other services (n8n, vaultwarden,
    # traefik, the Easypanel panel itself). A runaway subprocess spawned through the
    # externalAgents engine (e.g. opencode) previously pegged the host hard enough
    # that only a full reboot recovered it. Capping here means the kernel OOM-kills
    # inside this container's cgroup instead of starving the whole host.
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          memory: 512M
    pids_limit: 1024
    networks:
      - easypanel

networks:
  easypanel:
    external: true

volumes:
  chat-data:
  workspace:
  skills:
  claude-home:
